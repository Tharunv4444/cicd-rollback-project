
name: CI CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t cicd-rollback-test:${{ github.sha }} .

      - name: Run test container
        run: |
          docker run -d --name test-app -p 3000:3000 cicd-rollback-test:${{ github.sha }}

      - name: Test application health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs test-app
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f test-app || true

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Configure SSH verification
        env:
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application and deployment script to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            'mkdir -p ~/cicd-rollback-project/scripts'

          scp -o StrictHostKeyChecking=yes \
            Dockerfile app.js package.json package-lock.json \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/"

          scp -o StrictHostKeyChecking=yes \
            scripts/deploy-and-rollback.sh \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/scripts/"

      - name: Deploy and rollback
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -eu
          cd ~/cicd-rollback-project

          bash scripts/deploy-and-rollback.sh \
            "rollback-node-app:$RELEASE" \
            "rollback-node-app" \
            "3000" \
            "3001" \
            "false"
          REMOTE

  rollback-simulation:
    runs-on: ubuntu-latest
    needs: test-and-deploy

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build known-good image
        run: docker build -t rollback-test:known-good .

      - name: Start known-good application
        run: |
          docker run -d \
            --name rollback-test-app \
            -p 3002:3000 \
            rollback-test:known-good

      - name: Verify initial health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3002/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs rollback-test-app
          exit 1

      - name: Simulate failed deployment
        run: |
          docker rm -f rollback-test-app
          docker run -d \
            --name rollback-test-app \
            --entrypoint sh \
            -p 3002:3000 \
            rollback-test:known-good \
            -c 'sleep 300'

      - name: Confirm simulated failure
        run: |
          if curl --fail --max-time 3 http://localhost:3002/health; then
            echo "ERROR: The simulated failure unexpectedly passed."
            exit 1
          else
            echo "Expected failure detected."
          fi

      - name: Restore known-good version
        if: always()
        run: |
          docker rm -f rollback-test-app || true
          docker run -d \
            --name rollback-test-app \
            -p 3002:3000 \
            rollback-test:known-good

      - name: Verify recovery
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3002/health; then
              echo "Recovery successful."
              exit 0
            fi
            sleep 2
          done
          docker logs rollback-test-app
          exit 1

      - name: Clean up rollback test
        if: always()
        run: docker rm -f rollback-test-app || true

  azure-rollback-integration-test:
    runs-on: ubuntu-latest
    needs: test-and-deploy

    steps:
      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Configure SSH verification
        env:
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment script to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            'mkdir -p ~/cicd-rollback-project/scripts'

          scp -o StrictHostKeyChecking=yes \
            scripts/deploy-and-rollback.sh \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/scripts/"

      - name: Test actual rollback logic on isolated port
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -eu
          cd ~/cicd-rollback-project

          NAME="rollback-integration-test"
          PORT="3003"
          CANDIDATE_PORT="3004"
          IMAGE="rollback-integration-test:known-good"

          cleanup() {
            sudo docker rm -f "$NAME" "${NAME}-candidate" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Build a test image from the current application.
          sudo docker build -t "$IMAGE" .

          # Start a known-good container on the isolated test port.
          cleanup
          sudo docker run -d --name "$NAME" \
            -p "$PORT:3000" "$IMAGE"

          healthy=0
          for i in $(seq 1 10); do
            if curl --fail "http://localhost:$PORT/health"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            sudo docker logs "$NAME" || true
            echo "Initial test application is unhealthy."
            exit 1
          fi

          # Run the shared deployment script in simulation mode.
          # It will capture the previous image, pass candidate
          # health checks, simulate a failed replacement, and roll back.
          set +e
          bash scripts/deploy-and-rollback.sh \
            "$IMAGE" "$NAME" "$PORT" "$CANDIDATE_PORT" "true"
          result=$?
          set -e

          # A simulated failed deployment must return failure,
          # even when rollback succeeds.
          if [ "$result" -eq 0 ]; then
            echo "ERROR: Simulated deployment unexpectedly succeeded."
            exit 1
          fi

          # Confirm the rollback restored a healthy application.
          if ! curl --fail --max-time 5 "http://localhost:$PORT/health"; then
            sudo docker logs "$NAME" || true
            echo "ERROR: Application was not healthy after rollback."
            exit 1
          fi

          echo "Actual rollback function executed and recovery verified."
          REMOTE
