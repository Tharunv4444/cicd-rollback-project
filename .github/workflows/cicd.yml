
name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t cicd-rollback-app:${{ github.sha }} .

      - name: Run Docker container
        run: |
          docker run -d --name test-app -p 3000:3000 cicd-rollback-app:${{ github.sha }}

      - name: Test application health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs test-app
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f test-app || true
