
name: CI CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t cicd-rollback-test:${{ github.sha }} .

      - name: Run test container
        run: |
          docker run -d --name test-app -p 3000:3000 cicd-rollback-test:${{ github.sha }}

      - name: Test application health
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs test-app
          exit 1

      - name: Clean up test container
        if: always()
        run: docker rm -f test-app || true

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Configure SSH verification
        env:
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            'mkdir -p ~/cicd-rollback-project'

          scp -o StrictHostKeyChecking=yes \
            Dockerfile app.js package.json package-lock.json \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/"

      - name: Deploy and rollback
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "RELEASE='$RELEASE' bash -s" <<'REMOTE'
          set -eu
          cd ~/cicd-rollback-project

          IMAGE="rollback-node-app:$RELEASE"
          OLD_IMAGE="$(sudo docker inspect --format='{{.Config.Image}}' rollback-node-app 2>/dev/null || true)"

          # Build and test the candidate before replacing the live app.
          sudo docker rm -f rollback-node-candidate >/dev/null 2>&1 || true
          sudo docker build -t "$IMAGE" .
          sudo docker run -d --name rollback-node-candidate -p 3001:3000 "$IMAGE"

          healthy=0
          for i in $(seq 1 10); do
            if curl --fail http://localhost:3001/health; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            sudo docker logs rollback-node-candidate || true
            sudo docker rm -f rollback-node-candidate || true
            echo "Candidate failed health check. Existing app was not replaced."
            exit 1
          fi

          sudo docker rm -f rollback-node-candidate

          # Replace the live application.
          if [ -n "$OLD_IMAGE" ]; then
            sudo docker rm -f rollback-node-app
          fi

          if ! sudo docker run -d --name rollback-node-app -p 3000:3000 "$IMAGE"; then
            sudo docker rm -f rollback-node-app || true

            if [ -n "$OLD_IMAGE" ]; then
              if sudo docker run -d --name rollback-node-app -p 3000:3000 "$OLD_IMAGE"; then
                echo "Previous image started after deployment startup failure."
              else
                echo "CRITICAL: Could not start the previous image."
              fi
            fi

            exit 1
          fi

          # Check the newly deployed application.
          healthy=0
          for i in $(seq 1 10); do
            if curl --fail http://localhost:3000/health; then
              healthy=1
              break
            fi
            sleep 2
          done

          # If the new version fails, restore and verify the previous version.
          if [ "$healthy" -ne 1 ]; then
            echo "Post-deployment health check failed."
            sudo docker logs rollback-node-app || true
            sudo docker rm -f rollback-node-app || true

            if [ -n "$OLD_IMAGE" ]; then
              echo "Attempting to restore previous version: $OLD_IMAGE"

              if sudo docker run -d --name rollback-node-app -p 3000:3000 "$OLD_IMAGE"; then
                rollback_healthy=0

                for i in $(seq 1 10); do
                  if curl --fail http://localhost:3000/health; then
                    rollback_healthy=1
                    break
                  fi
                  sleep 2
                done

                if [ "$rollback_healthy" -eq 1 ]; then
                  echo "Rollback successful: previous version is healthy."
                else
                  echo "CRITICAL: Previous version failed its health check."
                  sudo docker logs rollback-node-app || true
                  exit 1
                fi
              else
                echo "CRITICAL: Failed to start previous version."
                exit 1
              fi
            else
              echo "CRITICAL: No previous version exists to restore."
              exit 1
            fi

            # Report deployment failure even when rollback succeeds.
            exit 1
          fi

          echo "Deployment successful: $IMAGE"
          REMOTE

