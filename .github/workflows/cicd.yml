
name: CI CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check application syntax
        run: node --check app.js

      - name: Build Docker image
        run: docker build -t "cicd-rollback-app:${GITHUB_SHA}" .

      - name: Test application container
        run: |
          set -e
          docker rm -f test-app || true
          docker run -d --name test-app \
            -p 3000:3000 \
            "cicd-rollback-app:${GITHUB_SHA}"

          for i in {1..10}; do
            if curl --fail http://localhost:3000/health; then
              echo "Application health check passed."
              docker rm -f test-app
              exit 0
            fi
            sleep 2
          done

          docker logs test-app
          docker rm -f test-app || true
          exit 1

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Configure SSH verification
        env:
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application and deployment script to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            'mkdir -p ~/cicd-rollback-project/scripts'

          scp -o StrictHostKeyChecking=yes \
            Dockerfile app.js package.json package-lock.json \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/"

          scp -o StrictHostKeyChecking=yes \
            scripts/deploy-and-rollback.sh \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/scripts/"

      - name: Deploy with automatic rollback
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "cd ~/cicd-rollback-project && \
            bash scripts/deploy-and-rollback.sh \
            'rollback-node-app:${RELEASE}' \
            'rollback-node-app' \
            '3000' \
            '3001' \
            'false'"

  rollback-simulation:
    runs-on: ubuntu-latest
    needs: test-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build known-good image
        run: docker build -t rollback-test:known-good .

      - name: Start known-good application
        run: |
          docker run -d --name rollback-test-app \
            -p 3002:3000 rollback-test:known-good

          for i in {1..10}; do
            if curl --fail http://localhost:3002/health; then
              echo "Known-good application is healthy."
              exit 0
            fi
            sleep 2
          done

          docker logs rollback-test-app
          exit 1

      - name: Simulate deployment failure
        run: |
          docker rm -f rollback-test-app

          docker run -d --name rollback-test-app \
            --entrypoint sh \
            -p 3002:3000 \
            rollback-test:known-good \
            -c 'sleep 300'

          if curl --fail --max-time 3 \
            http://localhost:3002/health; then
            echo "Unexpected healthy response."
            exit 1
          fi

          echo "Simulated deployment failure detected."

      - name: Restore known-good version
        if: always()
        run: |
          docker rm -f rollback-test-app || true
          docker run -d --name rollback-test-app \
            -p 3002:3000 \
            rollback-test:known-good

      - name: Verify recovery
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:3002/health; then
              echo "Recovery successful."
              exit 0
            fi
            sleep 2
          done

          docker logs rollback-test-app
          exit 1

      - name: Clean up rollback test
        if: always()
        run: docker rm -f rollback-test-app || true

  azure-rollback-integration-test:
    runs-on: ubuntu-latest
    needs: test-and-deploy

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load SSH private key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.AZURE_VM_SSH_KEY }}

      - name: Configure SSH verification
        env:
          KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy application and deployment script to Azure VM
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            'mkdir -p ~/cicd-rollback-project/scripts'

          scp -o StrictHostKeyChecking=yes \
            Dockerfile app.js package.json package-lock.json \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/"

          scp -o StrictHostKeyChecking=yes \
            scripts/deploy-and-rollback.sh \
            "$VM_USER@$VM_HOST:~/cicd-rollback-project/scripts/"

      - name: Test actual rollback logic on isolated port
        env:
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          RELEASE: ${{ github.sha }}
        run: |
          ssh -o StrictHostKeyChecking=yes "$VM_USER@$VM_HOST" \
            "cd ~/cicd-rollback-project && bash -s -- '${RELEASE}'" <<'REMOTE'
          set -Eeuo pipefail

          IMAGE="rollback-integration-test:$1"
          NAME="rollback-integration-test"
          PORT="3003"
          CANDIDATE_PORT="3004"

          cleanup() {
            sudo docker rm -f "$NAME" "${NAME}-candidate" \
              >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          # Create a known-good release for the isolated test.
          sudo docker build -t rollback-integration-test:known-good .

          cleanup
          sudo docker run -d --name "$NAME" \
            -p "$PORT:3000" \
            rollback-integration-test:known-good

          healthy=0
          for i in $(seq 1 10); do
            if curl --fail "http://localhost:$PORT/health"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            sudo docker logs "$NAME" || true
            echo "Known-good test application failed to start."
            exit 1
          fi

          # The script intentionally returns exit code 1 after
          # a simulated deployment failure and successful rollback.
          set +e
          bash scripts/deploy-and-rollback.sh \
            "$IMAGE" "$NAME" "$PORT" "$CANDIDATE_PORT" "true"
          result=$?
          set -e

          if [ "$result" -ne 1 ]; then
            echo "Expected exit code 1 after simulated failure and rollback; got $result."
            exit 1
          fi

          healthy=0
          for i in $(seq 1 10); do
            if curl --fail "http://localhost:$PORT/health"; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" -ne 1 ]; then
            echo "Rollback recovery verification failed."
            sudo docker logs "$NAME" || true
            exit 1
          fi

          echo "Integration test passed: failed deployment detected and previous release restored."
          REMOTE
